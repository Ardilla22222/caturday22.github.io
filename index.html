<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="logo.png">
  <title>Caturday22 — Access</title>

  <style>
    :root {
      --bg: #fff;
      --text: #000;
      --line: #ddd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    main {
      width: 100%;
      max-width: 800px;
      text-align: center;
    }

    .brand {
      font-size: 12px;
      letter-spacing: 5px;
      margin-bottom: 45px;
    }

    h1 {
      font-size: clamp(20px, 4vw, 38px);
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -1px;
      margin: 0 auto 12px;
      max-width: 720px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      color: #777;
      margin-bottom: 38px;
      text-transform: uppercase;
    }

    .game-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 15px 2px;
      font-size: 11px;
      letter-spacing: 1px;
      gap: 10px;
    }

    #score {
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .game-wrap {
      position: relative;
      width: 100%;
      margin-top: 12px;
      overflow: hidden;
      background: #fff;
      border-bottom: 2px solid #000;
      touch-action: manipulation;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    #message {
      min-height: 22px;
      margin-top: 20px;
      font-size: 12px;
      letter-spacing: 1px;
    }

    #restart {
      display: none;
      margin: 18px auto 0;
      padding: 13px 25px;
      color: #fff;
      background: #000;
      border: 1px solid #000;
      font-size: 11px;
      letter-spacing: 2px;
      cursor: pointer;
    }

    #restart:hover {
      color: #000;
      background: #fff;
    }

    .instructions {
      color: #777;
      font-size: 10px;
      line-height: 2;
      margin-top: 35px;
      letter-spacing: 1px;
    }

    .signature {
      font-size: 10px;
      color: #aaa;
      margin-top: 55px;
    }

    @media (max-width: 480px) {
      .brand { margin-bottom: 32px; }
      .subtitle { margin-bottom: 28px; }
      .instructions { margin-top: 25px; }
      .signature { margin-top: 35px; }
      body { padding: 18px 14px; }
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">CATURDAY22.COM</div>

    <h1>POR FAVOR, INGRESE SU CLAVE DE ACCESO 22</h1>
    <div class="subtitle">CONFIRMA TU EXISTENCIA</div>

    <div class="game-info">
      <span>CATURDAY RUNNER</span>
      <span id="score">SCORE: 0.0</span>
    </div>

    <div class="game-wrap">
      <canvas id="game" width="800" height="240"
        aria-label="Juego de saltos de Caturday22"></canvas>
    </div>

    <div id="message" aria-live="polite">
      SALTA LOS OBSTÁCULOS PARA ENTRAR.
    </div>

    <button id="restart" type="button">TRY AGAIN ↻</button>

    <div class="instructions">
      [ SPACE ] / [ ↑ ] TO JUMP<br>
      MOBILE: TAP TO JUMP<br>
      0.2 POINTS PER OBSTACLE
    </div>

    <div class="signature">
      © 2026 CATURDAY22 — 22
    </div>
  </main>

  <script>
    "use strict";

    // CONFIGURACIÓN DEL JUEGO
    const TARGET_SCORE = 22;
    const POINTS_PER_OBSTACLE = 0.2;
    const TARGET_OBSTACLES = Math.round(TARGET_SCORE / POINTS_PER_OBSTACLE);

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElem = document.getElementById("score");
    const messageElem = document.getElementById("message");
    const restartBtn = document.getElementById("restart");

    const W = canvas.width;
    const H = canvas.height;
    const groundY = 200;

    let running = true;
    let gameOver = false;
    let won = false;
    let lastTime = 0;
    let elapsed = 0;
    let spawnIn = 1.0;
    let obstacles = [];
    let passed = 0;
    let speed = 330;
    let animationId = 0;

    const cat = {
      x: 85,
      y: groundY - 38,
      w: 34,
      h: 38,
      vy: 0,
      gravity: 1900,
      jumpForce: 690,
      grounded: true
    };

    // Fondo de ciudad: edificios y ventanas en pixel art.
    function drawCity() {
      ctx.fillStyle = "#f5f5f5";

      const buildingWidths = [62, 86, 55, 78, 68, 92, 58, 76, 64, 88];
      let cursor = 0;
      let i = 0;

      while (cursor < W + 100) {
        const bw = buildingWidths[i % buildingWidths.length];
        const bh = 38 + ((i * 29) % 66);
        const offset = (elapsed * 18) % 80;
        const bx = cursor - offset;

        ctx.fillStyle = "#f4f4f4";
        ctx.fillRect(bx, groundY - bh - 12, bw - 3, bh);

        ctx.fillStyle = "#d2d2d2";
        for (let wx = bx + 8; wx < bx + bw - 8; wx += 15) {
          for (let wy = groundY - bh; wy < groundY - 18; wy += 15) {
            ctx.fillRect(wx, wy, 5, 6);
          }
        }

        cursor += bw;
        i++;
      }

      // Faroles
      ctx.fillStyle = "#c4c4c4";
      for (let i = 0; i < 5; i++) {
        const x = ((i * 190 - elapsed * 55) % (W + 100) + W + 100) % (W + 100) - 30;
        ctx.fillRect(x, groundY - 66, 3, 66);
        ctx.fillRect(x - 8, groundY - 68, 20, 3);
      }
    }

    function drawCat() {
      const x = Math.round(cat.x);
      const y = Math.round(cat.y);

      ctx.fillStyle = "#000";
      // Cuerpo y cabeza
      ctx.fillRect(x + 4, y + 12, 25, 20);
      ctx.fillRect(x + 5, y + 2, 24, 19);

      // Orejas
      ctx.fillRect(x + 4, y - 3, 8, 9);
      ctx.fillRect(x + 22, y - 3, 8, 9);

      // Ojos
      ctx.fillStyle = "#fff";
      ctx.fillRect(x + 10, y + 9, 3, 3);
      ctx.fillRect(x + 21, y + 9, 3, 3);

      // Patas animadas
      ctx.fillStyle = "#000";
      const step = cat.grounded && running ? Math.floor(elapsed * 12) % 2 : 0;
      ctx.fillRect(x + 6, y + 30, 7, step ? 8 : 5);
      ctx.fillRect(x + 21, y + 30, 7, step ? 5 : 8);

      // Cola
      ctx.fillRect(x - 4, y + 19, 7, 4);
      ctx.fillRect(x - 7, y + 14, 4, 8);
    }

    function drawObstacle(o) {
      const x = Math.round(o.x);
      const y = groundY;
      ctx.fillStyle = "#000";

      if (o.type === 0) {
        // AUTO DE POLICÍA
        ctx.fillRect(x, y - 20, 42, 14);
        ctx.fillRect(x + 7, y - 27, 25, 10);

        // Baliza
        ctx.fillRect(x + 17, y - 31, 7, 4);

        // Ventanas
        ctx.fillStyle = "#fff";
        ctx.fillRect(x + 11, y - 24, 8, 5);
        ctx.fillRect(x + 22, y - 24, 7, 5);

        // Insignia
        ctx.fillStyle = "#000";
        ctx.fillRect(x + 19, y - 17, 5, 4);

        // Ruedas
        ctx.fillRect(x + 6, y - 8, 9, 8);
        ctx.fillRect(x + 30, y - 8, 9, 8);
        ctx.fillStyle = "#fff";
        ctx.fillRect(x + 9, y - 5, 3, 3);
        ctx.fillRect(x + 33, y - 5, 3, 3);

      } else if (o.type === 1) {
        // PEATÓN PIXELADO
        ctx.fillRect(x + 8, y - 35, 11, 11); // cabeza
        ctx.fillRect(x + 6, y - 24, 15, 14); // torso
        ctx.fillRect(x + 1, y - 22, 6, 12); // brazo
        ctx.fillRect(x + 20, y - 22, 6, 10); // brazo
        ctx.fillRect(x + 7, y - 11, 6, 11); // pierna
        ctx.fillRect(x + 15, y - 11, 6, 11); // pierna

        ctx.fillStyle = "#fff";
        ctx.fillRect(x + 11, y - 31, 2, 2);
        ctx.fillRect(x + 16, y - 31, 2, 2);

      } else if (o.type === 2) {
        // SEÑAL DE TRÁNSITO
        ctx.fillRect(x + 13, y - 9, 5, 9); // poste
        ctx.fillRect(x, y - 43, 31, 24); // panel
        ctx.fillStyle = "#fff";
        ctx.fillRect(x + 4, y - 39, 23, 16);
        ctx.fillStyle = "#000";
        ctx.fillRect(x + 13, y - 36, 4, 8);
        ctx.fillRect(x + 13, y - 26, 4, 3);

      } else {
        // BARRICADA URBANA
        ctx.fillRect(x, y - 23, 38, 13);
        ctx.fillRect(x + 4, y - 10, 5, 10);
        ctx.fillRect(x + 29, y - 10, 5, 10);
        ctx.fillStyle = "#fff";
        ctx.fillRect(x + 7, y - 21, 6, 9);
        ctx.fillRect(x + 21, y - 21, 6, 9);
      }
    }

    function drawScene() {
      ctx.clearRect(0, 0, W, H);

      drawCity();

      // Calle y línea de suelo
      ctx.fillStyle = "#000";
      ctx.fillRect(0, groundY, W, 2);

      // Marcas de la calle
      ctx.fillStyle = "#aaa";
      for (let i = 0; i < 20; i++) {
        const x = ((i * 57 - elapsed * speed * 0.45) % W + W) % W;
        ctx.fillRect(x, groundY + 10, 12, 1);
      }

      // Obstáculos y personaje
      obstacles.forEach(drawObstacle);
      drawCat();

      // Número discreto de la firma
      ctx.fillStyle = "#ddd";
      ctx.font = "10px monospace";
      ctx.fillText("22", W - 28, 22);
    }

    function updateScore() {
      // No mostrar el máximo necesario.
      scoreElem.textContent =
        "SCORE: " + (passed * POINTS_PER_OBSTACLE).toFixed(1);
    }

    function jump() {
      if (won) return;

      if (gameOver) {
        resetGame();
        return;
      }

      if (cat.grounded) {
        cat.vy = -cat.jumpForce;
        cat.grounded = false;
      }
    }

    function endGame() {
      running = false;
      gameOver = true;
      cancelAnimationFrame(animationId);

      messageElem.textContent = "GAME OVER — ACCESS DENIED.";
      restartBtn.style.display = "block";

      drawScene();

      ctx.fillStyle = "rgba(255,255,255,0.90)";
      ctx.fillRect(0, 65, W, 75);

      ctx.fillStyle = "#000";
      ctx.textAlign = "center";
      ctx.font = "bold 24px monospace";
      ctx.fillText("GAME OVER", W / 2, 98);
      ctx.font = "12px monospace";
      ctx.fillText("OBSTACLES: " + passed, W / 2, 122);
      ctx.textAlign = "left";
    }

    function winGame() {
      won = true;
      running = false;
      cancelAnimationFrame(animationId);

      updateScore();
      messageElem.textContent = "ACCESS GRANTED. WELCOME TO CATURDAY22.";
      restartBtn.style.display = "none";

      drawScene();

      ctx.fillStyle = "rgba(255,255,255,0.94)";
      ctx.fillRect(0, 55, W, 100);

      ctx.fillStyle = "#000";
      ctx.textAlign = "center";
      ctx.font = "bold 26px monospace";
      ctx.fillText("ACCESS GRANTED", W / 2, 96);
      ctx.font = "12px monospace";
      ctx.fillText("WELCOME TO CATURDAY22", W / 2, 122);
      ctx.textAlign = "left";

      // El index original debe guardarse como web.html.
      setTimeout(() => {
        window.location.href = "web.html";
      }, 1600);
    }

    function resetGame() {
      cancelAnimationFrame(animationId);

      running = true;
      gameOver = false;
      won = false;
      lastTime = 0;
      elapsed = 0;
      spawnIn = 1.0;
      obstacles = [];
      passed = 0;
      speed = 330;

      cat.y = groundY - cat.h;
      cat.vy = 0;
      cat.grounded = true;

      restartBtn.style.display = "none";
      messageElem.textContent = "SALTA LOS OBSTÁCULOS PARA ENTRAR.";

      updateScore();
      drawScene();
      animationId = requestAnimationFrame(loop);
    }

    function loop(timestamp) {
      if (!running) return;

      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.035);
      lastTime = timestamp;

      elapsed += dt;
      speed = Math.min(330 + elapsed * 3, 490);

      // Física del salto
      cat.vy += cat.gravity * dt;
      cat.y += cat.vy * dt;

      if (cat.y >= groundY - cat.h) {
        cat.y = groundY - cat.h;
        cat.vy = 0;
        cat.grounded = true;
      }

      // Generar obstáculos urbanos con ancho y altura correctos.
      spawnIn -= dt;

      if (spawnIn <= 0) {
        const last = obstacles[obstacles.length - 1];

        if (!last || last.x < W - 230) {
          const type = Math.floor(Math.random() * 4);
          const widths = [42, 27, 31, 38];
          const heights = [31, 35, 43, 23];

          obstacles.push({
            x: W + 10,
            w: widths[type],
            h: heights[type],
            type,
            scored: false
          });

          spawnIn = 0.95 + Math.random() * 0.65;
        } else {
          spawnIn = 0.15;
        }
      }

      for (const o of obstacles) {
        o.x -= speed * dt;

        // Cada obstáculo superado suma exactamente 0.2 puntos.
        if (!o.scored && o.x + o.w < cat.x) {
          o.scored = true;
          passed++;
          updateScore();

          if (passed >= TARGET_OBSTACLES) {
            winGame();
            return;
          }
        }

        // Colisiones: la altura corresponde al obstáculo dibujado.
        const marginX = 5;
        const marginY = 4;
        const obstacleTop = groundY - o.h;

        const hit =
          cat.x + marginX < o.x + o.w &&
          cat.x + cat.w - marginX > o.x &&
          cat.y + marginY < groundY &&
          cat.y + cat.h - marginY > obstacleTop &&
          cat.y + cat.h > obstacleTop;

        if (hit) {
          endGame();
          return;
        }
      }

      obstacles = obstacles.filter(o => o.x + o.w > -10);

      drawScene();
      animationId = requestAnimationFrame(loop);
    }

    // Teclado: espacio o flecha arriba.
    document.addEventListener("keydown", event => {
      if (event.code === "Space" || event.code === "ArrowUp") {
        event.preventDefault();
        if (!event.repeat) jump();
      }
    });

    // Móvil: tocar el área del juego para saltar.
    canvas.addEventListener("pointerdown", event => {
      event.preventDefault();
      jump();
    });

    restartBtn.addEventListener("click", resetGame);

    // Inicio
    updateScore();
    drawScene();
    animationId = requestAnimationFrame(loop);
  </script>
</body>
</html>
